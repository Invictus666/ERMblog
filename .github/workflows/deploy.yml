name: Deploy to PythonAnywhere

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 ssh.pythonanywhere.com >> ~/.ssh/known_hosts

      - name: Pull, migrate, collectstatic, reload
        run: |
          ssh -i ~/.ssh/id_ed25519 NgWaiChung1974@ssh.pythonanywhere.com '
            set -e
            cd ~/mysite
            git fetch origin
            git reset --hard origin/main
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate
            python manage.py collectstatic --noinput
            touch /var/www/ngwaichung1974_pythonanywhere_com_wsgi.py
          '
